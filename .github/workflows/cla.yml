name: CLA

# Asks every external contributor to accept CLA.md once (by comment on the pull request). Signatures are stored
# in signatures/cla.json on the branch "cla-signatures" of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action does not check out or run code from the pull request.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Mibuw/miPDFlib/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Mibuw,dependabot[bot],github-actions[bot]
