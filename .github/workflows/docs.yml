name: Docs

# API reference and guides (DocFX) on GitHub Pages: https://mibuw.github.io/miPDFlib/
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'docfx/**'
      - 'assets/**'
      - 'dotnet-tools.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet tool restore
      - run: dotnet docfx docfx/docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docfx/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
